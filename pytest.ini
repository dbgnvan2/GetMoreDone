[pytest]
# -rs prints the REASON for every skip. Without it a suppressed run reports a
# bare "3 skipped" and the mapped-window opt-out's carefully worded skip
# message is never shown to the person who needs to see it.
addopts = -rs
markers =
    meta: asserts on the repository itself (workflows, packaging, licences, docs, traceability) rather than on application behaviour. Run `pytest -m "not meta"` for a fast app-only pass; the default run always includes them.
    audio: exercises the optional timer/audio integration (skipped automatically when no music folder is configured)
