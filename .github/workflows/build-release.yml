name: Build binaries

# Spec: docs/spec_2026-08-18_downloadable_release.md#r-m4
#
# Every OS job proves its own bundle starts before anything is published. That
# step (R-M4.A) is the automated guard against finding F1: for the whole life of
# this workflow it produced binaries that died on launch because GetMoreDone.spec
# never bundled themes/, and nothing here ever ran them.
#
# R-M4.C sources the release body from CHANGELOG.md, and R-M4.D puts LICENSE,
# THIRD_PARTY_NOTICES.md and licenses/ inside every archive — the LGPL requires
# the licence text to accompany the distribution, and a notice that ships only
# in the repo never reaches someone who downloaded a binary.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: create/update a GitHub Release with this tag (e.g. v0.1.0). Leave blank to only upload artifacts.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean GetMoreDone.spec

      - name: Verify the packaged bundle starts
        # R-M4.A. GetMoreDone.exe is built console=False (windowed subsystem),
        # so `& app.exe` returns IMMEDIATELY without waiting and leaves
        # $LASTEXITCODE unset — the first version of this step threw
        # "(exit )" while the selftest was still running and went on to pass
        # 4/4. Start-Process -Wait -PassThru gives a real exit code; the output
        # is redirected to files because a windowed process has no console.
        shell: pwsh
        env:
          GETMOREDONE_DB: ${{ runner.temp }}\selftest.db
        run: |
          $proc = Start-Process -FilePath "dist\GetMoreDone\GetMoreDone.exe" `
            -ArgumentList "--selftest" -Wait -PassThru `
            -RedirectStandardOutput selftest-out.txt `
            -RedirectStandardError selftest-err.txt
          if (Test-Path selftest-out.txt) { Get-Content selftest-out.txt }
          if (Test-Path selftest-err.txt) { Get-Content selftest-err.txt }
          if ($proc.ExitCode -ne 0) { throw "Packaged build failed its selftest (exit $($proc.ExitCode))" }

      - name: Stage licence files beside the executable (R-M4.D)
        # The spec also bundles these into _internal/, but a user who unzips
        # sees only GetMoreDone.exe and _internal/ — a licence buried in there
        # is not "included" in any useful sense. These land at the folder root.
        # Unlike the macOS case there is no nesting: the spec's copies go to
        # _internal/, so these target paths do not already exist.
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\GetMoreDone\
          Copy-Item THIRD_PARTY_NOTICES.md dist\GetMoreDone\
          Copy-Item -Recurse -Force licenses dist\GetMoreDone\licenses

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GetMoreDone\* -DestinationPath GetMoreDone-win64.zip

      - name: Checksum (SHA-256)
        # R-M4.B. Same two-space format as `shasum -a 256`, so `sha256sum -c`
        # verifies either platform's file.
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 GetMoreDone-win64.zip).Hash.ToLower()
          "$hash  GetMoreDone-win64.zip" | Out-File -Encoding ascii -NoNewline GetMoreDone-win64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GetMoreDone-win64
          # Default is 'warn': a path set matching nothing would log a warning
          # and leave the job green with no artifact attached. Note this fires
          # only on a TOTAL miss — one of the two files missing still uploads a
          # partial artifact. The checksum step would fail the job first.
          if-no-files-found: error
          path: |
            GetMoreDone-win64.zip
            GetMoreDone-win64.zip.sha256

      - name: Extract release notes from CHANGELOG (R-M4.C)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "${{ github.ref_name }}" }
          python tools/extract_release_notes.py $tag --output RELEASE_NOTES.md
        env:
          INPUT_TAG: ${{ inputs.release_tag }}

      - name: Upload to GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          # R-M4.C — the notes come from CHANGELOG.md rather than being typed
          # by hand, so the release and the repo cannot disagree.
          body_path: RELEASE_NOTES.md
          # Default is false: a glob matching nothing would publish a public,
          # permanent Release with correct notes and zero downloadable assets,
          # and report success. extract_release_notes.py — the producer feeding
          # this same step — already exits non-zero on missing input; these
          # consumers must be just as loud (P5).
          fail_on_unmatched_files: true
          files: |
            GetMoreDone-win64.zip
            GetMoreDone-win64.zip.sha256

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean GetMoreDone.spec

      # ------------------------------------------------------------------
      # Code signing and notarisation (macOS). Entirely optional: with no
      # signing secrets configured every step below is skipped and the job
      # behaves exactly as it did before, producing an unsigned build.
      #
      # Add the six secrets in docs/CODE_SIGNING.md and it turns itself on.
      # What it must never do is ship an UNSIGNED build while appearing to
      # have signed one — so the only thing that skips these steps is the
      # absence of credentials. Once present, any failure fails the job.
      # ------------------------------------------------------------------
      - name: Are signing credentials configured?
        id: signing
        # The secret goes through env, never interpolated into the script body:
        # a value with quotes or newlines would otherwise break or leak.
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ] && [ -n "$NOTARY_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing credentials present: this build will be signed and notarised."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing credentials configured — producing an UNSIGNED build. Users will need the Gatekeeper step in INSTALL.md. See docs/CODE_SIGNING.md to enable signing."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign the app bundle
        if: steps.signing.outputs.available == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Sign inside-out rather than with --deep: Apple documents --deep as
          # unsuitable for real bundles, and a PyInstaller app is full of
          # nested .so/.dylib files that each need their own signature.
          APP="dist/GetMoreDone.app"
          find "$APP" -type f \( -name "*.so" -o -name "*.dylib" \) -print0 \
            | xargs -0 -I{} codesign --force --timestamp --options runtime \
                --entitlements packaging/entitlements.plist \
                --sign "$IDENTITY" {}
          find "$APP/Contents/Frameworks" -maxdepth 1 -type f -perm -111 -print0 2>/dev/null \
            | xargs -0 -r -I{} codesign --force --timestamp --options runtime \
                --entitlements packaging/entitlements.plist \
                --sign "$IDENTITY" {}
          codesign --force --timestamp --options runtime \
            --entitlements packaging/entitlements.plist \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarise and staple
        if: steps.signing.outputs.available == 'true'
        env:
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "dist/GetMoreDone.app" "$RUNNER_TEMP/notarize.zip"

          # --wait makes a rejection fail this step rather than pass silently.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

          # Staple the ticket into the bundle so it validates offline.
          xcrun stapler staple "dist/GetMoreDone.app"
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Verify the signature and notarisation
        if: steps.signing.outputs.available == 'true'
        # Reconcile against the artifact rather than trusting the previous
        # steps' exit codes (P6). spctl is what Gatekeeper itself runs.
        run: |
          APP="dist/GetMoreDone.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          echo "Signed, notarised and stapled — this build opens without a Gatekeeper prompt."

      - name: Clean up the signing keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          security delete-keychain "$KEYCHAIN" || true

      - name: Verify the packaged bundle starts
        # R-M4.A. bash steps run with -e, so a non-zero exit fails the job.
        env:
          GETMOREDONE_DB: ${{ runner.temp }}/selftest.db
        run: |
          ./dist/GetMoreDone.app/Contents/MacOS/GetMoreDone --selftest

      # No staging step here on purpose. GetMoreDone.spec already bundles
      # LICENSE, THIRD_PARTY_NOTICES.md and licenses/ into Contents/Resources.
      # Copying them again produced Resources/licenses/licenses/ — `cp -R src
      # dest` copies *into* dest when dest already exists. R-M4.D is satisfied
      # by the spec on macOS; tests/test_ci_contract.py asserts both halves.

      - name: Zip macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/GetMoreDone.app" "GetMoreDone-mac.zip"

      - name: Checksum (SHA-256)
        run: |
          shasum -a 256 GetMoreDone-mac.zip > GetMoreDone-mac.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GetMoreDone-mac
          # Default is 'warn': a path set matching nothing would log a warning
          # and leave the job green with no artifact attached. Note this fires
          # only on a TOTAL miss — one of the two files missing still uploads a
          # partial artifact. The checksum step would fail the job first.
          if-no-files-found: error
          path: |
            GetMoreDone-mac.zip
            GetMoreDone-mac.zip.sha256

      - name: Extract release notes from CHANGELOG (R-M4.C)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          python tools/extract_release_notes.py "$TAG" --output RELEASE_NOTES.md

      - name: Upload to GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          # R-M4.C — the notes come from CHANGELOG.md rather than being typed
          # by hand, so the release and the repo cannot disagree.
          body_path: RELEASE_NOTES.md
          # Default is false: a glob matching nothing would publish a public,
          # permanent Release with correct notes and zero downloadable assets,
          # and report success. extract_release_notes.py — the producer feeding
          # this same step — already exits non-zero on missing input; these
          # consumers must be just as loud (P5).
          fail_on_unmatched_files: true
          files: |
            GetMoreDone-mac.zip
            GetMoreDone-mac.zip.sha256
