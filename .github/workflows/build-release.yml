name: Build binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: create/update a GitHub Release with this tag (e.g. v0.1.0). Leave blank to only upload artifacts.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean GetMoreDone.spec

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GetMoreDone\* -DestinationPath GetMoreDone-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetMoreDone-win64
          path: GetMoreDone-win64.zip

      - name: Upload to GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: GetMoreDone-win64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean GetMoreDone.spec

      - name: Zip macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/GetMoreDone.app" "GetMoreDone-mac.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetMoreDone-mac
          path: GetMoreDone-mac.zip

      - name: Upload to GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: GetMoreDone-mac.zip
